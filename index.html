<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Reports</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10191e" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
/* VOICE: a finance desk's working tool, plain and exact.
   IDEA: the paper expense claim form with receipts stapled behind it.
   PICTURE: the working report itself: number, total, receipt rows.
   COLOUR AND TYPE: white, ink, one red tab, slate for links; Source Serif 4 heads, Inter body.
   LAYOUT: one calm column sized for a phone, rules instead of boxes. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10191e);--ink:light-dark(#121212,#eef3f5);--mut:light-dark(#5b6770,#9db0ba);--red:light-dark(#e3120b,#ff6257);--slate:light-dark(#2e6f8e,#7fc0dd);--panel:light-dark(#e3ecf0,#1a2830);--line:light-dark(#cfd9de,#2c3e48);--ok:light-dark(#1d7a46,#6fd39a);--warn:light-dark(#9a5b00,#f0b45a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:32px}h2{font-size:22px}h3{font-size:17px;font-family:inherit;font-weight:600}
a{color:var(--slate)}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,16px)}
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:block;text-decoration:none;color:var(--ink);padding:0 0 12px}
.brand::before{content:"";display:block;width:44px;height:10px;background:var(--red);margin-bottom:12px}
.brand b{font:600 20px/1 "Source Serif 4",Georgia,serif}
.nav{display:flex;gap:4px;padding-bottom:6px}
.nav a{padding:10px 12px;min-height:44px;text-decoration:none;color:var(--mut);font-weight:500;border-bottom:3px solid transparent}
.nav a.on{color:var(--ink);border-color:var(--red)}
main{padding:24px 0 72px}
.mut{color:var(--mut)}.sm{font-size:14px}.num{font-variant-numeric:tabular-nums;white-space:nowrap}.r{text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border:1.5px solid var(--ink);border-radius:6px;background:transparent;color:var(--ink);font:600 16px/1.2 inherit;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns.fill>*{flex:1 1 140px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.list>li{border-bottom:1px solid var(--line)}
.rep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:14px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rep .no{font-weight:700}
.rep .amt{font:600 18px/1.2 inherit;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:13px;font-weight:600;background:var(--panel);color:var(--ink);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}
.empty{padding:36px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:16px;margin:18px 0;background:var(--panel);border-radius:6px}
.total b{font:600 clamp(28px,8vw,40px)/1.05 "Source Serif 4",Georgia,serif;font-variant-numeric:tabular-nums;white-space:nowrap}
dl.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:14px 0 0;font-size:15px}
dl.meta dt{color:var(--mut)}dl.meta dd{margin:0;overflow-wrap:anywhere}
.rc{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:12px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;align-items:start}
.rc .th{grid-row:span 3;width:52px;height:64px;border-radius:4px;background:var(--panel);object-fit:cover;display:block}
.rc .th.none{display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.2;color:var(--mut)}
.rc .m{font-weight:600;overflow-wrap:anywhere}.rc .a{font-weight:600;text-align:right}
.rc .sub{grid-column:2/4;display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px 8px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:13px}td.r,th.r{text-align:right;padding-right:0}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
section{margin-top:30px}
section>h2{margin-bottom:10px}
.note{padding:10px 12px;border-left:4px solid var(--slate);background:var(--panel);border-radius:0 6px 6px 0;font-size:15px;margin:12px 0}
.note.bad{border-color:var(--red)}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
#sheet[hidden],#toast[hidden]{display:none}
.sh-top{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.sh-body{padding:18px 0 48px}
label.f{display:block;margin:0 0 14px;font-size:14px;font-weight:600}
label.f span.h{display:block;font-weight:400;color:var(--mut);font-size:13px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;min-height:46px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:400 16px/1.3 inherit}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0}fieldset[disabled]{opacity:.5}
.shot{display:block;max-width:100%;max-height:300px;margin:0 auto 14px;border:1px solid var(--line);border-radius:4px}
.reading{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-weight:600}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 14px}
.quick button{min-height:40px;padding:6px 12px;border:1.5px solid var(--line);border-radius:99px;background:none;color:var(--ink);font:500 14px/1.2 inherit;cursor:pointer}
.quick button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.calc{padding:12px;background:var(--panel);border-radius:6px;margin:4px 0 16px;font-size:15px}
.calc b{font-variant-numeric:tabular-nums}
details{margin:0 0 14px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--slate);font-weight:500}
.items{list-style:none;margin:0;padding:0;font-size:14px}
.items li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.codes .row{display:grid;grid-template-columns:76px minmax(0,1fr) 56px 40px;gap:8px;align-items:center;margin-bottom:8px}
.codes .row.hd{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:4px}.codes .row.hd span:nth-child(3){text-align:center}
.codes .row input{margin:0}
.codes .row label{display:grid;place-items:center;min-height:44px}
.codes .row input[type=radio]{width:22px;min-height:22px;height:22px;margin:0}
.x{min-width:36px;min-height:44px;border:0;background:none;color:var(--red);font:600 20px/1 inherit;cursor:pointer}
.ent{padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;width:max-content;max-width:92vw;padding:12px 16px;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:500;box-shadow:0 6px 24px rgb(0 0 0/.25)}
.st li{display:flex;gap:8px;align-items:baseline;padding:4px 0}
.st{list-style:none;padding:0;margin:0;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}.dot.off{background:var(--warn)}
@media(max-width:480px){.two{grid-template-columns:1fr}.codes .row{grid-template-columns:68px minmax(0,1fr) 50px 36px;gap:6px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#reports"><b>Expense reports</b></a>
  <nav class="nav"><a href="#reports" id="nav-reports">Reports</a><a href="#setup" id="nav-setup">Setup</a></nav>
</div></header>
<main><div class="wrap" id="view"><p class="mut">Loading saved reports…</p></div></main>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>
<input class="vh" type="file" id="cam" accept="image/*" capture="environment" tabindex="-1">
<input class="vh" type="file" id="lib" accept="image/*" tabindex="-1">
<input class="vh" type="file" id="doc" accept="application/pdf,.pdf,image/*" tabindex="-1">
<input class="vh" type="file" id="restore" accept="application/json,.json" tabindex="-1">
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="lib/xlsx.mini.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script>
{
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const MON = 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');
const fd = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? (+m[3]) + ' ' + MON[m[2] - 1] + ' ' + m[1] : ''; };
const ZERO = new Set(['IDR', 'JPY', 'KRW', 'VND']);
const dec = c => ZERO.has(c) ? 0 : 2;
const rnd = (n, c) => { const f = 10 ** dec(c); return Math.round(+((+n || 0) * f).toFixed(6)) / f; };
const fmt = (n, c) => (+n || 0).toLocaleString('en-SG', {minimumFractionDigits: dec(c), maximumFractionDigits: dec(c)});
const money = (n, c) => c + ' ' + fmt(n, c);
const num = x => { if (typeof x === 'number') return isFinite(x) ? x : 0; const v = parseFloat(String(x ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(v) ? v : 0; };
/* amounts as the model returns them: tolerates "125.000", "1,234.50" and "1.234,50" when a string slips through */
const amt = x => { if (typeof x === 'number') return isFinite(x) ? x : 0; let s = String(x ?? '').replace(/[^0-9.,\-]/g, ''); if (/^-?\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, ''); else { const i = Math.max(s.lastIndexOf('.'), s.lastIndexOf(',')); if (i >= 0) s = s.slice(0, i).replace(/[.,]/g, '') + '.' + s.slice(i + 1); } const v = parseFloat(s); return isFinite(v) ? v : 0; };
const CURS = ['SGD', 'IDR', 'USD', 'MYR', 'EUR', 'GBP', 'JPY', 'AUD', 'HKD', 'THB', 'CNY', 'KRW', 'VND', 'AED'];

const STD_CODES = [
  {code: '6100', label: 'Travel: Airfare'},
  {code: '6110', label: 'Travel: Lodging and accommodation'},
  {code: '6120', label: 'Travel: Ground transport (taxi, train, car hire)'},
  {code: '6125', label: 'Travel: Fuel, tolls and parking'},
  {code: '6130', label: 'Travel: Meals', meal: 1},
  {code: '6140', label: 'Travel: Visa, insurance and incidentals'},
  {code: '6200', label: 'Entertainment: Client', meal: 1},
  {code: '6210', label: 'Entertainment: Staff', meal: 1},
  {code: '6220', label: 'Entertainment: Alcohol', alcohol: 1},
  {code: '6300', label: 'Office: Supplies and stationery'},
  {code: '6310', label: 'Office: Printing, postage and courier'},
  {code: '6320', label: 'Office: Telephone and internet'},
  {code: '6330', label: 'Office: Software and subscriptions'},
  {code: '6400', label: 'Professional fees'},
  {code: '6410', label: 'Training, conferences and seminars'},
  {code: '6420', label: 'Books and publications'},
  {code: '6500', label: 'Gifts and donations'},
  {code: '6600', label: 'Bank charges and fees'},
  {code: '6900', label: 'Miscellaneous'}
];
const DEFAULTS = () => ({
  entities: [
    {id: 'AEI', name: 'Aren Energy Investment Pte. Ltd.', prefix: 'AEI', currency: 'SGD'},
    {id: 'YMM', name: 'Yayasan Mens et Manus', prefix: 'YMM', currency: 'IDR'}
  ],
  codes: clone(STD_CODES), counters: {}
});
const merge = d => { const o = DEFAULTS(); for (const k in o) if (d && d[k] != null) o[k] = clone(d[k]); return o; };

const S = {settings: DEFAULTS(), reports: {}, ready: false, slow: false, curId: null, err: ''};
const cap = {sample: null, images: false, downloads: null, viewer: false, key: '', model: 'claude-sonnet-5-5'};
const MODELS = [['claude-sonnet-5-5', 'Claude Sonnet 5.5 (balanced)'], ['claude-haiku-5-5', 'Claude Haiku 5.5 (fastest, lowest cost)'], ['claude-opus-5-5', 'Claude Opus 5.5 (most capable)']];
const canRead = () => !!(cap.sample && cap.images) || (!cap.viewer && !!cap.key);
try { S.curId = sessionStorage.getItem('xp.cur'); } catch (e) {}

const codeOf = c => S.settings.codes.find(x => x.code === c);
const label = c => (codeOf(c) || {}).label || '';
const alcCode = () => (S.settings.codes.find(x => x.alcohol) || {code: '6220'}).code;
const cur = () => S.reports[S.curId] || null;
const allImgs = rc => [rc.img, ...(rc.more || [])].filter(Boolean);
/* remembered defaults are read from the reports that exist, so a deleted report leaves nothing behind */
const recent = () => Object.values(S.reports).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
const lastPerson = entId => { const r = recent().find(x => x.entityId === entId); return r ? {name: r.name, institution: r.institution, position: r.position} : {}; };
const projectList = () => [...new Set(recent().map(r => r.project).filter(Boolean))].slice(0, 12);
const lastRate = (c, base) => { for (const r of Object.values(S.reports).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''))) if (r.currency === base) for (const rc of (r.receipts || []).slice().reverse()) if (rc.currency === c && +rc.rate > 0) return +rc.rate; return 0; };

/* ---------- storage: Claude storage when available, this browser otherwise ---------- */
const idb = {
  db: null,
  open() { return new Promise((ok, no) => { const q = indexedDB.open('expense-reports', 1); q.onupgradeneeded = () => { for (const n of ['kv', 'reports', 'images']) if (!q.result.objectStoreNames.contains(n)) q.result.createObjectStore(n); }; q.onsuccess = () => { this.db = q.result; ok(); }; q.onerror = () => no(q.error); }); },
  tx(n, mode, fn) { return new Promise((ok, no) => { const t = this.db.transaction(n, mode), q = fn(t.objectStore(n)); t.oncomplete = () => ok(q && q.result); t.onerror = t.onabort = () => no(t.error); }); },
  get(n, k) { return this.tx(n, 'readonly', o => o.get(k)); },
  all(n) { return this.tx(n, 'readonly', o => o.getAll()); },
  put(n, k, v) { return this.tx(n, 'readwrite', o => o.put(v, k)); },
  del(n, k) { return this.tx(n, 'readwrite', o => o.delete(k)); },
  clear(n) { return this.tx(n, 'readwrite', o => o.clear()); }
};
const queue = {};
const enqueue = (key, fn) => (queue[key] = (queue[key] || Promise.resolve()).catch(() => {}).then(fn));
const store = {
  mode: 'local', db: null, me: null, assets: null, idb: false, persisted: false, img: new Map(),
  p() { const b = 'data/users/' + this.me; const s = this.db.doc(b + '/store'); return {settings: this.db.doc(b + '/settings'), reports: s.collection('reports'), images: s.collection('images')}; },
  async init({db, uid, assets}) {
    this.assets = assets || null;
    if (db && uid) {
      this.db = db; this.me = uid; this.mode = 'cloud';
      const got = {s: false, r: false};
      const done = () => { if (got.s && got.r && !S.ready) { S.ready = true; S.slow = false; clearTimeout(timer); } softRender(); };
      const fail = e => { S.err = 'Saved data cannot be read (' + ((e && e.code) || 'error') + '). Reloading the page may help.'; S.ready = true; clearTimeout(timer); render(); };
      const timer = setTimeout(() => { if (!S.ready) { S.slow = true; render(); } }, 10000);
      const p = this.p();
      p.settings.onSnapshot(snap => { if (snap.exists) S.settings = merge(snap.data()); got.s = true; done(); }, fail);
      p.reports.onSnapshot(q => { const m = {}; q.docs.forEach(d => { m[d.id] = clone(d.data()); }); S.reports = m; got.r = true; done(); }, fail);
    } else {
      /* outside Claude: everything stays on this device, in the browser's database */
      try {
        await idb.open(); this.idb = true;
        S.settings = merge(await idb.get('kv', 'settings'));
        S.reports = Object.fromEntries((await idb.all('reports')).map(r => [r.id, r]));
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { this.persisted = ok; }).catch(() => {});
      } catch (e) {
        this.idb = false;
        try {
          S.settings = merge(JSON.parse(localStorage.getItem('xp.settings') || 'null'));
          S.reports = JSON.parse(localStorage.getItem('xp.reports') || '{}') || {};
        } catch (e2) {}
      }
      S.ready = true; render();
    }
  },
  local() { try { localStorage.setItem('xp.settings', JSON.stringify(S.settings)); localStorage.setItem('xp.reports', JSON.stringify(S.reports)); } catch (e) { toast('This browser refused to save the data.'); } },
  saveSettings() {
    const s = clone(S.settings);
    if (this.mode === 'cloud') return enqueue('settings', () => this.p().settings.set(s)).catch(saveErr);
    if (this.idb) return enqueue('settings', () => idb.put('kv', 'settings', s)).catch(saveErr);
    this.local(); return Promise.resolve();
  },
  saveReport(r) {
    r.updatedAt = new Date().toISOString(); const body = clone(r); S.reports[r.id] = body;
    if (this.mode === 'cloud') return enqueue('r:' + r.id, () => this.p().reports.doc(r.id).set(body)).catch(saveErr);
    if (this.idb) return enqueue('r:' + r.id, () => idb.put('reports', r.id, body)).catch(saveErr);
    this.local(); return Promise.resolve();
  },
  deleteReport(id) {
    delete S.reports[id];
    if (this.mode === 'cloud') return enqueue('r:' + id, () => this.p().reports.doc(id).delete()).catch(saveErr);
    if (this.idb) return enqueue('r:' + id, () => idb.del('reports', id)).catch(saveErr);
    this.local(); return Promise.resolve();
  },
  async putImage(blob) {
    if (this.assets) {
      try { const a = await this.assets.upload(blob, {type: 'image/jpeg'}); this.img.set('a:' + a.id, a.url); return 'a:' + a.id; }
      catch (e) { console.warn('asset upload failed', e && e.code); }
    }
    if (this.mode === 'local' && this.idb) { const id = newId(); await idb.put('images', id, {type: blob.type || 'image/jpeg', buf: await blob.arrayBuffer()}); this.img.set('l:' + id, URL.createObjectURL(blob)); return 'l:' + id; }
    let small = await shrink(blob, 1000, 0.6), data = await toDataURL(small);
    if (data.length > 230000) { small = await shrink(blob, 760, 0.5); data = await toDataURL(small); }
    const id = newId();
    if (this.mode === 'cloud') { await this.p().images.doc(id).set({data}); this.img.set('d:' + id, data); return 'd:' + id; }
    this.img.set('l:' + id, data); try { localStorage.setItem('xp.img.' + id, data); } catch (e) {}
    return 'l:' + id;
  },
  async imageUrl(ref) {
    if (!ref) return '';
    if (this.img.has(ref)) return this.img.get(ref);
    const id = ref.slice(2); let u = '';
    if (ref[0] === 'a') u = '/_blob/' + id;
    else if (ref[0] === 'd' && this.mode === 'cloud') { try { const s = await this.p().images.doc(id).get(); u = s.exists ? (s.data().data || '') : ''; } catch (e) {} }
    else if (this.idb) { try { const x = await idb.get('images', id); u = x ? URL.createObjectURL(new Blob([x.buf], {type: x.type})) : ''; } catch (e) {} }
    else { try { u = localStorage.getItem('xp.img.' + id) || ''; } catch (e) {} }

  } catch (e) { out.innerHTML = '<p class="note bad">' + esc(READ_ERR[e && e.code] || 'The sample receipt could not be read (' + ((e && e.code) || 'error') + ').') + '</p>'; }
  /* second part: photo storage and the export files, on a throwaway report that is never saved */
  out.insertAdjacentHTML('beforeend', '<p class="reading" id="st2" style="margin-top:12px"><span class="spin"></span>Checking photo storage and export files…</p>');
  const rows = []; let ref = '';
  const step = async (name, fn) => { try { rows.push([name, await fn(), true]); } catch (e) { rows.push([name, (e && (e.code || e.message)) || 'error', false]); } };
  const kb = b => Math.max(1, Math.round(b.size / 1024)) + ' kB';
  await step('Photo stored', async () => { ref = await store.putImage(await sampleReceipt()); return ref[0] === 'a' || (ref[0] === 'l' && store.idb) ? 'Full quality' : 'Reduced size'; });
  const r = {number: 'TEST-0000', entityName: 'Self test', currency: 'SGD', project: 'Self test', from: today(), to: today(), name: '', institution: '', position: '', status: 'draft',
    receipts: [{id: 't', date: '2026-11-14', merchant: 'Harbour Lane Kitchen', purpose: 'Sample receipt', code: (S.settings.codes.find(c => c.meal) || S.settings.codes[0]).code, currency: 'SGD', total: 151.07, alcohol: 57.55, rate: 0, img: ref}]};
  await step('Photo loaded back', async () => { if (!ref) throw new Error('no photo'); store.img.delete(ref); const im = await loadImg(await store.imageUrl(ref)), c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0); c.toDataURL('image/jpeg', 0.5); return im.naturalWidth + ' x ' + im.naturalHeight; });
  await step('PDF with photo built', async () => { const b = await buildPdf(r); if (b.size < 15000) throw new Error('photo missing from the PDF'); return kb(b); });
  await step('Excel file built', async () => kb(buildXlsx(r)));
  await step('Test photo removed', async () => { if (!(await store.dropImage(ref))) throw new Error('not removed'); return 'Done'; });
  const st2 = $('#st2'); if (st2) st2.outerHTML = '<table style="margin-top:12px"><thead><tr><th>Storage and export</th><th>Result</th><th class="r">Check</th></tr></thead><tbody>' + rows.map(x => '<tr><td>' + x[0] + '</td><td>' + esc(x[1]) + '</td><td class="r"><span class="chip ' + (x[2] ? 'ok' : 'warn') + '">' + (x[2] ? 'Correct' : 'Failed') + '</span></td></tr>').join('') + '</tbody></table>';
  btn.disabled = false;
}

/* ---------- actions ---------- */
const armed = b => { if (b.dataset.armed) return true; b.dataset.armed = '1'; b.dataset.t = b.textContent; b.textContent = 'Tap again to confirm'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = b.dataset.t; } }, 4000); return false; };
const go = h => { if (location.hash === '#' + h) render(); else location.hash = h; };
const acts = {
  new() { metaSheet(null); },
  open(b) { S.curId = b.dataset.id; try { sessionStorage.setItem('xp.cur', S.curId); } catch (e) {} go('report'); window.scrollTo(0, 0); },
  close() { if (E && E.ctl) E.ctl.abort(); if (E && E.isNew && E.upload) E.upload.then(refs => (refs || []).forEach(ref => store.dropImage(ref))); closeSheet(); },
  'edit-meta'() { metaSheet(cur()); },
  async 'save-meta'() {
    const s = S.settings, r0 = cur() && !$('#m-ent') ? cur() : null, v = id => $(id).value.trim(), err = t => { const e = $('#m-err'); e.textContent = t; e.hidden = false; };
    const from = v('#m-from'), to = v('#m-to');
    if (!v('#m-project')) return err('A project is needed.');
    if (!from || !to) return err('Both period dates are needed.');
    if (from > to) return err('The period must end on or after the day it starts.');
    if (!v('#m-name')) return err('A name is needed.');
    const f = {project: v('#m-project'), from, to, name: v('#m-name'), institution: v('#m-inst'), position: v('#m-pos')};
    let r;
    if (r0) r = Object.assign(clone(r0), f);
    else {
      const ent = s.entities.find(e => e.id === v('#m-ent'));
      r = Object.assign({id: newId(), number: nextNumber(ent, new Date().getFullYear()), entityId: ent.id, entityName: ent.name, currency: ent.currency, status: 'draft', createdAt: new Date().toISOString(), receipts: []}, f);
    }
    S.curId = r.id; try { sessionStorage.setItem('xp.cur', r.id); } catch (e) {}
    closeSheet(); if (!r0) store.saveSettings(); store.saveReport(r); go('report'); window.scrollTo(0, 0);
  },
  manual() { const r = cur(); E = {isNew: true, rc: {id: newId(), merchant: '', date: today(), purpose: '', code: '', currency: r.currency, total: 0, alcohol: 0, rate: 0, note: '', items: [], img: ''}}; rcSheet(); },
  'edit-rc'(b) { const rc = (cur().receipts || []).find(x => x.id === b.dataset.id); if (!rc) return; E = {isNew: false, rc: clone(rc)}; rcSheet(); },
  quick(b) { $('#f-code').value = b.dataset.code; syncRc(); },
  'skip-read'() { if (E && E.ctl) E.ctl.abort(); },
  'retry-read'() { if (E && E.blobs) { pullRc(); runRead(E); } },
  async 'save-rc'(b) {
    pullRc(); const r = clone(cur()), rc = E.rc, err = t => { const e = $('#f-err'); e.textContent = t; e.hidden = false; e.scrollIntoView({block: 'center'}); };
    if (!rc.merchant) return err('The merchant name is needed.');
    if (!rc.date) return err('The receipt date is needed.');
    if (rc.currency.length !== 3) return err('The currency is a 3-letter code such as SGD, IDR or USD.');
    if (!(rc.total > 0)) return err('The receipt total must be more than zero.');
    if (rc.alcohol > rc.total) return err('The alcohol portion cannot be more than the receipt total.');
    if (!rc.code) return err('An expense code is needed.');
    if (rc.currency !== r.currency && !(rc.rate > 0)) return err('An exchange rate from ' + rc.currency + ' to ' + r.currency + ' is needed.');
    if (rc.currency === r.currency) rc.rate = 0;
    b.disabled = true; b.textContent = 'Saving…';
    if (E.upload) await E.upload;
    const out = clone(rc), i = r.receipts.findIndex(x => x.id === out.id);
    if (i >= 0) r.receipts[i] = out; else r.receipts.push(out);
    E.isNew = false; closeSheet(); store.saveReport(r); render();
  },
  'del-rc'(b) { if (!armed(b)) return; const r = clone(cur()), rc = r.receipts.find(x => x.id === E.rc.id); r.receipts = r.receipts.filter(x => x.id !== E.rc.id); closeSheet(); store.saveReport(r); if (rc) allImgs(rc).forEach(ref => store.dropImage(ref)); render(); },
  status() { const r = clone(cur()); r.status = r.status === 'submitted' ? 'draft' : 'submitted'; store.saveReport(r); render(); },
  'del-report'(b) {
    if (!armed(b)) return; const r = cur(), m = /^(.+-\d{4})-(\d+)$/.exec(r.number || '');
    (r.receipts || []).forEach(rc => allImgs(rc).forEach(ref => store.dropImage(ref))); store.deleteReport(r.id);
    /* deleting the newest draft of a series frees its number again */
    if (m && r.status !== 'submitted' && +S.settings.counters[m[1]] === +m[2]) { S.settings.counters[m[1]] = +m[2] - 1; store.saveSettings(); }
    S.curId = null; go('reports');
  },
  async pdf(b) { const t = b.textContent; b.disabled = true; b.textContent = 'Building the PDF…'; try { const r = cur(); await deliver(r.number + '.pdf', await buildPdf(r)); } catch (e) { console.error(e); toast('The PDF could not be built: ' + (e.message || 'error')); } if (b.isConnected) { b.disabled = false; b.textContent = t; } },
  async xlsx(b) { b.disabled = true; try { const r = cur(); await deliver(r.number + '.xlsx', buildXlsx(r)); } catch (e) { console.error(e); toast('The Excel file could not be built: ' + (e.message || 'error')); } if (b.isConnected) b.disabled = false; },
  'add-code'() { $('#codes').insertAdjacentHTML('beforeend', codeRow({code: '', label: ''})); const rows = $('#codes').querySelectorAll('.row'); rows[rows.length - 1].querySelector('input').focus(); },
  'del-code'(b) { const row = b.closest('.row'); if (row.querySelector('[name=calc]').checked) return toast('The alcohol code cannot be removed. Mark another code for alcohol first.'); row.remove(); },
  'reset-codes'(b) { if (!armed(b)) return; $('#codes').innerHTML = STD_CODES.map(codeRow).join(''); toast('Standard chart restored. Save setup to keep it.'); },
  'add-ent'() { const keep = readSetup(true); S.settings.entities = keep.entities.concat({id: 'E' + newId().slice(-5).toUpperCase(), name: '', prefix: '', currency: 'SGD'}); S.settings.codes = keep.codes; render(); },
  'del-ent'(b) { if (!armed(b)) return; b.closest('.ent').remove(); },
  'save-setup'() { const x = readSetup(false); if (!x) return; S.settings.entities = x.entities; S.settings.codes = x.codes; store.saveSettings(); render(); toast('Setup saved.'); },
  selftest(b) { selfTest(b); },
  'save-key'() {
    const k = $('#k-key').value.trim(), m = $('#k-model').value;
    if (k && !/^sk-ant-[\w-]{10,}$/.test(k)) return toast('This does not look like an Anthropic API key. It starts with sk-ant.');
    try { if (k) localStorage.setItem('xp.key', k); localStorage.setItem('xp.model', m); } catch (e) { return toast('This browser refused to save the key.'); }
    if (k) cap.key = k; cap.model = m; render(); toast(k ? 'Key and model saved on this device.' : 'Model saved.');
  },
  'del-key'(b) { if (!armed(b)) return; try { localStorage.removeItem('xp.key'); } catch (e) {} cap.key = ''; render(); toast('Key removed from this device.'); },
  async 'share-file'() { if (!ready) return; try { await navigator.share({files: [ready.file], title: ready.name}); } catch (e) { if (!e || e.name !== 'AbortError') toast('Sharing did not work here. The Download button is the alternative.'); } },
  async backup(b) { b.disabled = true; try { await deliver('expense-backup-' + today() + '.json', await buildBackup()); } catch (e) { console.error(e); toast('The backup could not be made.'); } if (b.isConnected) b.disabled = false; },
  async 'do-restore'(b) {
    const d = pendingRestore; if (!d) return; if (!store.idb) { closeSheet(); return toast('This browser cannot hold a restored backup.'); } b.disabled = true; b.textContent = 'Restoring…';
    try {
      for (const n of ['kv', 'reports', 'images']) await idb.clear(n);
      await idb.put('kv', 'settings', merge(d.settings));
      for (const r of Object.values(d.reports)) if (r && r.id) await idb.put('reports', r.id, r);
      for (const [ref, data] of Object.entries(d.images || {})) { const blob = await (await fetch(data)).blob(); await idb.put('images', ref.slice(2), {type: blob.type || 'image/jpeg', buf: await blob.arrayBuffer()}); }
      /* photos from a backup made inside Claude carry other references; point them at the local copies */
      const loc = ref => ref && ref[0] !== 'l' && d.images && d.images[ref] ? 'l:' + ref.slice(2) : ref;
      for (const r of Object.values(d.reports)) { let ch = false; for (const rc of (r.receipts || [])) { const a = loc(rc.img), m = (rc.more || []).map(loc); if (a !== rc.img || m.some((x, j) => x !== rc.more[j])) { rc.img = a; rc.more = m; ch = true; } } if (ch) await idb.put('reports', r.id, r); }
      S.settings = merge(d.settings); S.reports = Object.fromEntries(Object.values(d.reports).filter(r => r && r.id).map(r => [r.id, r])); store.img.clear(); pendingRestore = null; S.curId = null;
      closeSheet(); go('reports'); toast('Backup restored.');
    } catch (e) { console.error(e); toast('The backup could not be restored completely.'); closeSheet(); }
  }
};
function readSetup(quiet) {
  const bad = t => { if (!quiet) toast(t); return null; };
  const entities = [...document.querySelectorAll('#ents .ent')].map(el => ({id: el.dataset.ent, name: el.querySelector('[name=ename]').value.trim(), prefix: el.querySelector('[name=eprefix]').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''), currency: el.querySelector('[name=ecur]').value.trim().toUpperCase().replace(/[^A-Z]/g, '')}));
  const codes = [...document.querySelectorAll('#codes .row')].map(el => { const c = {code: el.querySelector('[name=ccode]').value.trim(), label: el.querySelector('[name=clabel]').value.trim()}; if (el.querySelector('[name=calc]').checked) c.alcohol = 1; else if (el.querySelector('[name=clabel]').dataset.meal) c.meal = 1; return c; }).filter(c => quiet || c.code || c.label);
  if (quiet) return {entities, codes};
  if (!entities.length) return bad('At least one entity is needed.');
  for (const e of entities) { if (!e.name) return bad('Every entity needs a name.'); if (e.prefix.length < 2) return bad('Every number prefix needs at least 2 letters or digits.'); if (e.currency.length !== 3) return bad('Every report currency is a 3-letter code.'); }
  if (new Set(entities.map(e => e.prefix)).size !== entities.length) return bad('Two entities share a number prefix.');
  for (const c of codes) if (!c.code || !c.label) return bad('Every expense code needs both a code and a name.');
  if (new Set(codes.map(c => c.code)).size !== codes.length) return bad('Two expense codes share the same code.');
  if (codes.filter(c => c.alcohol).length !== 1) return bad('Exactly one code must be marked for alcohol.');
  if (codes.length < 2) return bad('At least one code besides the alcohol code is needed.');
  return {entities, codes};
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled && acts[b.dataset.act]) acts[b.dataset.act](b, e); });
sheet.addEventListener('input', syncRc);
$('#restore').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) readBackup(f); });
for (const id of ['cam', 'lib', 'doc']) $('#' + id).addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) addFromFile(f); });
/* a photo dragged onto an open draft report is treated like a chosen photo (desktop use) */
document.addEventListener('dragover', e => { if (route() === 'report') e.preventDefault(); });
document.addEventListener('drop', e => { const f = e.dataTransfer && [...e.dataTransfer.files].find(x => x.type.startsWith('image/') || isPdf(x)); if (!f) return; e.preventDefault(); const r = cur(); if (route() === 'report' && r && r.status !== 'submitted' && sheet.hidden) addFromFile(f); });
window.addEventListener('hashchange', () => { if (!sheet.hidden) acts.close(); render(); });

/* ---------- start ---------- */
async function boot() {
  render();
  const c = window.claude; cap.viewer = !!(c && c.use);
  const use = n => cap.viewer ? Promise.resolve(c.use(n)).catch(() => null) : Promise.resolve(null);
  const [db, user, sample, downloads, assets] = await Promise.all(['db', 'user', 'sample', 'downloads', 'assets'].map(use));
  cap.sample = sample; cap.downloads = downloads;
  let uid = null; try { uid = user ? await user.id() : null; } catch (e) {}
  try { const lim = sample ? await sample.limits() : null; cap.images = !!(lim && lim.images); cap.maxImages = lim && lim.images ? lim.images.maxCount || 1 : 1; } catch (e) { cap.images = false; }
  if (!cap.viewer) {
    try { cap.key = localStorage.getItem('xp.key') || ''; const m = localStorage.getItem('xp.model'); if (m && MODELS.some(x => x[0] === m)) cap.model = m; } catch (e) {}
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  await store.init({db, uid, assets});
}
window.ExpenseApp = {S, cap, store, calc, buildPdf, buildXlsx, buildBackup, sampleReceipt, normalise, nextNumber};
boot();
}
